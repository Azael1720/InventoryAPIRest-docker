services:
  api:
    image: mi-api-net10
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7013:7013"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Inventory12345Pass
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Inventory12345Pass' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: InventoryAPIRest.Web/Dockerfile
    ports:
      - "5100:8080"
    environment:
      ApiSettings__BaseUrl: http://api:8080
      Keycloak__Authority: http://keycloak:8080/realms/InventoryRealm
      Keycloak__ClientId: inventory-web
      Keycloak__ClientSecret: ${WEB_CLIENT_SECRET}
    depends_on:
      - api